import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion
import org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'java'
	id 'org.jetbrains.kotlin.jvm'
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(17))
	}
	withJavadocJar()
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	// 源码统一使用 UTF-8，避免在非 UTF-8 默认编码的平台上编译含中文注释的文件时出现字符解析问题。
	options.encoding = 'UTF-8'
	if (it.name.contains("Test")) {
		options.release = 11
	} else {
		options.release = 8
	}
}

tasks.withType(KotlinCompile).configureEach {
	it.compilerOptions.jvmTarget = it.name.contains("Test") ? JvmTarget.JVM_11 : JvmTarget.JVM_1_8
}

tasks.withType(KotlinCompilationTask.class).configureEach {
	it.compilerOptions.languageVersion = KotlinVersion.KOTLIN_2_0
}

tasks.withType(Javadoc).configureEach {
	// 显式指定 UTF-8 编码，否则在默认编码为 GBK 的平台上解析中文注释会失败，
	// 与下方 Xwerror 组合后会导致构建直接中断。
	options.encoding = 'UTF-8'
	options.charSet = 'UTF-8'
	options.addStringOption('Xdoclint:none', '-quiet')
	options.addBooleanOption('Xwerror', true)
}
