name: Continuous Integration
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: lint
        run: ./gradlew javaToolChains spotlessCheck
      - name: Assemble
        run: ./gradlew assemble
      - name: Test
        run: ./gradlew build testAllJavaVersions jacocoTestReport